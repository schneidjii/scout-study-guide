<style>
:root{--gd:#0a3d1f;--gm:#1a6b3a;--gl:#2d9e5a;--gp:#e8f5ee;--am:#c8821a;--ap:#fef3e2;--br:#5c3a1e;--bp:#f5ede3;--bm:#8b5e3c;--bl:#1a4d7a;--blp:#e8f0f8;--blm:#2d6fa5;--rp:#fdecea;--rd:#c0392b;--tx:#1a2e1e;--tm:#5a7060;--bo:#cde0d4;--bg:#f4f9f5;--wh:#ffffff;--ra:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:16px}
header{background:var(--gd);padding:1.25rem 1.25rem 1rem;position:relative;overflow:hidden}
header::before{content:'';position:absolute;top:-30px;right:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,0.04)}
.ey{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gl);margin-bottom:5px}
header h1{font-family:'Oswald',sans-serif;font-size:26px;font-weight:600;color:white;line-height:1.2;margin-bottom:4px}
header p{font-size:13px;color:rgba(255,255,255,0.55);line-height:1.5}
.sticky{background:var(--wh);border-bottom:1px solid var(--bo);padding:.85rem 1.25rem;position:sticky;top:0;z-index:100}
.pt{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.pt span{font-size:14px;font-weight:500;color:var(--tm)}
.pt strong{font-family:'Oswald',sans-serif;font-size:16px;color:var(--gm)}
.pbt{height:7px;background:var(--gp);border-radius:99px;overflow:hidden}
.pbf{height:7px;background:var(--gl);border-radius:99px;transition:width .4s ease}
.stabs{display:flex;background:var(--wh);border-bottom:2px solid var(--bo)}
.stab{flex:1;font-family:'Oswald',sans-serif;font-size:13px;font-weight:500;letter-spacing:.03em;padding:9px 4px;border:none;background:transparent;color:var(--tm);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .18s;text-align:center;line-height:1.3}
.stab.active{color:var(--gd);border-bottom-color:var(--gm)}
.stab.tc.active{color:var(--br);border-bottom-color:var(--bm)}
.stab.res.active{color:var(--bl);border-bottom-color:var(--blm)}
.mbar{display:flex;gap:6px;padding:.75rem 1.25rem;background:var(--wh);border-bottom:1px solid var(--bo)}
.mb{flex:1;font-family:'Oswald',sans-serif;font-size:15px;font-weight:500;letter-spacing:.03em;padding:9px;border-radius:var(--ra);border:1.5px solid var(--bo);background:transparent;color:var(--tm);cursor:pointer;transition:all .18s}
.mb.active{background:var(--gd);border-color:var(--gd);color:white}
.mb.active.tb{background:var(--br);border-color:var(--br)}
.main{padding:.85rem 1.25rem 3rem}
/* name gate */
.name-gate{position:fixed;inset:0;background:var(--gd);z-index:9000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1.5rem;text-align:center}
.name-gate .gate-icon{margin-bottom:1.25rem}
.name-gate h2{font-family:'Oswald',sans-serif;font-size:30px;font-weight:600;color:white;margin-bottom:8px}
.name-gate p{font-size:16px;color:rgba(255,255,255,0.65);margin-bottom:2rem;line-height:1.6;max-width:300px}
.name-gate .gate-btns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:300px}
.gate-btn{font-family:'Oswald',sans-serif;font-size:20px;font-weight:500;letter-spacing:.04em;padding:16px;border-radius:var(--ra);border:2px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.1);color:white;cursor:pointer;transition:all .18s;-webkit-tap-highlight-color:transparent}
.gate-btn:active{background:rgba(255,255,255,0.25)}
.gate-btn.dj{border-color:rgba(255,255,255,0.15);background:rgba(255,255,255,0.05);font-size:16px;padding:12px;margin-top:6px}
/* name picker inline */
.name-picker{background:var(--wh);border:1px solid var(--bo);border-radius:var(--ra);padding:1.25rem;text-align:center;margin-bottom:14px}
.name-picker h3{font-family:'Oswald',sans-serif;font-size:18px;color:var(--gd);margin-bottom:8px}
.name-picker p{font-size:15px;color:var(--tm);margin-bottom:14px}
.name-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.nbtn{font-family:'Oswald',sans-serif;font-size:15px;padding:9px 22px;border-radius:99px;border:2px solid var(--gm);background:transparent;color:var(--gm);cursor:pointer;transition:all .18s}
.nbtn:hover,.nbtn.sel{background:var(--gd);border-color:var(--gd);color:white}
/* cards */
.rc{background:var(--wh);border:1px solid var(--bo);border-radius:var(--ra);margin-bottom:10px;overflow:hidden}
.rc.dk{border-color:var(--gl)}.rc.dk.tc{border-color:var(--bm)}
.ch{display:flex;align-items:center;gap:10px;padding:.9rem 1rem;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.rc.dk .ch{background:var(--gp)}.rc.dk.tc .ch{background:var(--bp)}
.rb{font-family:'Oswald',sans-serif;font-size:12px;font-weight:600;padding:3px 8px;border-radius:5px;flex-shrink:0;letter-spacing:.03em;color:white}
.rb.g{background:var(--gd)}.rb.b{background:var(--bl)}.rb.t{background:var(--br)}
.ct{flex:1;font-size:15px;font-weight:500;color:var(--tx);line-height:1.3}
.cv{font-size:20px;color:var(--tm);transition:transform .2s;flex-shrink:0}
.rc.open .cv{transform:rotate(180deg)}
.cb{display:none;border-top:1px solid var(--bo);padding:1rem 1rem 1.2rem}
.rc.open .cb{display:block}
/* infographic */
.ig-wrap{margin-bottom:14px}
.ig-lbl{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gm);margin-bottom:6px;font-weight:500}
.ig-lbl.t{color:var(--bm)}
.ig-wrap img{width:100%;border-radius:8px;display:block;height:auto;cursor:zoom-in;-webkit-tap-highlight-color:transparent;margin-bottom:0}
.ig-wrap:last-child img{border-radius:8px}
.ig-hint{font-size:12px;color:var(--tm);margin-top:5px;text-align:right;font-style:italic}
.ig-note{font-size:12px;color:var(--am);margin-top:5px;font-style:italic;padding-left:4px;border-left:2px solid var(--am)}
/* lightbox */
.lb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:9999;flex-direction:column;align-items:center;justify-content:center;padding:12px;-webkit-tap-highlight-color:transparent}
.lb-overlay.open{display:flex}
.lb-overlay img{max-width:100%;max-height:calc(100vh - 60px);object-fit:contain;border-radius:8px;display:block}
.lb-close{position:absolute;top:14px;right:16px;font-size:30px;color:white;background:rgba(255,255,255,0.15);border:none;border-radius:50%;width:42px;height:42px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:sans-serif;line-height:1}
.lb-hint{color:rgba(255,255,255,0.5);font-size:14px;margin-top:10px;text-align:center}
/* video */
.vw{margin-bottom:14px}
.vl{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gm);margin-bottom:6px;font-weight:500}
.vf{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:8px;background:#000}
.vf iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;border-radius:8px}
.vtabs{display:flex;gap:6px;margin-bottom:9px}
.vtab{font-size:13px;padding:5px 12px;border-radius:99px;border:1px solid var(--bo);background:transparent;color:var(--tm);cursor:pointer}
.vtab.active{background:var(--gm);border-color:var(--gm);color:white}
/* content blocks */
.cblk{margin-bottom:14px}
.cl{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px;font-weight:500}
.cl.g{color:var(--gm)}.cl.b{color:var(--blm)}.cl.t{color:var(--bm)}
.cx{border-radius:7px;padding:11px 13px;font-size:15px;line-height:1.75;color:var(--tx);white-space:pre-line}
.cx.g{background:var(--gp)}.cx.b{background:var(--blp)}.cx.t{background:var(--bp)}
.tip{background:var(--ap);border-left:3px solid var(--am);border-radius:0 7px 7px 0;padding:10px 13px;font-size:14px;line-height:1.6;color:#5a3a00;margin-bottom:14px}
.tl{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--am);margin-bottom:3px;font-weight:500}
.notice{background:var(--bp);border-left:3px solid var(--bm);border-radius:0 7px 7px 0;padding:10px 13px;font-size:14px;line-height:1.6;color:var(--br);margin-bottom:14px}
.nl{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--bm);margin-bottom:3px;font-weight:500}
.info{background:var(--blp);border-left:3px solid var(--blm);border-radius:0 7px 7px 0;padding:10px 13px;font-size:14px;line-height:1.6;color:var(--bl);margin-bottom:14px}
.il{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--blm);margin-bottom:3px;font-weight:500}
.mkb{width:100%;padding:11px;border-radius:7px;border:1.5px solid var(--bo);background:transparent;font-family:'Source Sans 3',sans-serif;font-size:15px;font-weight:500;color:var(--tm);cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:6px}
.mkb.dk.g{background:var(--gp);border-color:var(--gl);color:var(--gd)}
.mkb.dk.t{background:var(--bp);border-color:var(--bm);color:var(--br)}
/* quiz */
.qc{background:var(--wh);border:1px solid var(--bo);border-radius:var(--ra);margin-bottom:10px;padding:1rem}
.qbr{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.qq{font-size:16px;font-weight:500;line-height:1.5;color:var(--tx);margin-bottom:13px}
.rvb{width:100%;padding:11px;border-radius:7px;border:1.5px solid;background:transparent;font-family:'Source Sans 3',sans-serif;font-size:15px;font-weight:500;cursor:pointer;transition:all .18s}
.rvb.g{border-color:var(--gm);color:var(--gm)}.rvb.t{border-color:var(--bm);color:var(--bm)}
.aa{display:none;margin-top:10px}.aa.sh{display:block}
.kr{display:flex;gap:8px;margin-top:11px}
.kb{flex:1;padding:10px 6px;border-radius:7px;border:1.5px solid var(--bo);background:transparent;font-family:'Source Sans 3',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:all .18s}
.kb.ky{color:var(--gm)}.kb.kn{color:var(--rd)}
.kb.sy{background:var(--gp);border-color:var(--gl);color:var(--gd)}
.kb.sn{background:var(--rp);border-color:#e08080;color:var(--rd)}
.cb2{border-radius:var(--ra);padding:1.25rem;text-align:center;margin-bottom:12px;color:white}
.cb2.g{background:var(--gd)}.cb2.t{background:var(--br)}
.cb2 .ic{font-size:30px;margin-bottom:6px}
.cb2 p{font-family:'Oswald',sans-serif;font-size:20px;font-weight:600;margin-bottom:4px}
.cb2 span{font-size:14px;color:rgba(255,255,255,.65)}
.sdiv{font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--tm);padding:6px 0 8px;margin-top:6px;border-bottom:1px solid var(--bo);margin-bottom:10px}
/* Results tab */
.res-header{background:var(--wh);border:1px solid var(--bo);border-radius:var(--ra);padding:1rem;margin-bottom:10px}
.res-header h3{font-family:'Oswald',sans-serif;font-size:17px;color:var(--bl);margin-bottom:4px}
.res-header p{font-size:14px;color:var(--tm)}
.user-card{background:var(--blp);border:1px solid var(--blm);border-radius:var(--ra);padding:.85rem 1rem;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.user-avatar{width:40px;height:40px;border-radius:50%;background:var(--bl);color:white;font-family:'Oswald',sans-serif;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.user-info{flex:1}
.user-name{font-size:16px;font-weight:500;color:var(--tx)}
.user-device{font-size:13px;color:var(--tm)}
.res-section{font-family:'Oswald',sans-serif;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--tm);padding:6px 0 8px;margin-top:12px;border-bottom:1px solid var(--bo);margin-bottom:10px}
.res-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:.5px solid var(--bo)}
.res-row:last-child{border-bottom:none}
.res-req{flex:1;font-size:15px;color:var(--tx)}
.res-badge{font-size:12px;padding:3px 9px;border-radius:99px;font-weight:500;flex-shrink:0}
.rb-pass{background:var(--gp);color:var(--gd)}.rb-miss{background:var(--rp);color:var(--rd)}.rb-skip{background:#f0f0f0;color:#888}.rb-todo{background:#fffbe6;color:#a07000}
.stat-row{display:flex;gap:8px;margin-bottom:12px}
.stat-box{flex:1;background:var(--wh);border:1px solid var(--bo);border-radius:var(--ra);padding:.75rem;text-align:center}
.stat-num{font-family:'Oswald',sans-serif;font-size:24px;font-weight:600;color:var(--gd)}
.stat-lbl{font-size:12px;color:var(--tm);margin-top:2px}
.clear-btn{width:100%;margin-top:14px;padding:11px;border-radius:7px;border:1.5px solid var(--rd);background:transparent;font-family:'Source Sans 3',sans-serif;font-size:15px;color:var(--rd);cursor:pointer}
.activity-item{font-size:13px;color:var(--tm);padding:6px 0;border-bottom:.5px solid var(--bo);display:flex;justify-content:space-between}
.activity-item:last-child{border-bottom:none}
.activity-time{font-size:12px;color:#aaa}
.no-data{text-align:center;padding:2rem;color:var(--tm);font-size:15px}
</style>
</head>

<script>
function getDeviceLabel(){
  const ua=navigator.userAgent;
  let dev='Unknown Device';
  if(/iPhone/.test(ua)) dev='iPhone';
  else if(/iPad/.test(ua)) dev='iPad';
  else if(/Android/.test(ua)&&/Mobile/.test(ua)) dev='Android Phone';
  else if(/Android/.test(ua)) dev='Android Tablet';
  else if(/Macintosh/.test(ua)) dev='Mac';
  else if(/Windows/.test(ua)) dev='Windows PC';
  else if(/Linux/.test(ua)) dev='Linux';
  return dev;
}
function getOrCreateSession(){
  let id=localStorage.getItem('scout_sid');
  if(!id){id='dev_'+Math.random().toString(36).substr(2,8);localStorage.setItem('scout_sid',id);}
  return id;
}
function getName(){return localStorage.getItem('scout_name')||'';}
function setName(n){localStorage.setItem('scout_name',n);logActivity('identity','Set name: '+n);}
const SID=getOrCreateSession();
const DEVICE=getDeviceLabel();

// ── ACTIVITY LOG ────────────────────────────────────────────────────────────
function logActivity(type,detail){
  const logs=JSON.parse(localStorage.getItem('scout_log')||'[]');
  logs.unshift({ts:Date.now(),name:getName(),sid:SID,device:DEVICE,type,detail});
  if(logs.length>200) logs.splice(200);
  localStorage.setItem('scout_log',JSON.stringify(logs));
}
function getLogs(){return JSON.parse(localStorage.getItem('scout_log')||'[]');}

// ── STATE ────────────────────────────────────────────────────────────────────
let sec='rank', mode='study';
const LR={},LT={},QR={},QT={};

// ── DATA ─────────────────────────────────────────────────────────────────────
const rankReqs=[
  {grp:'Requirement 1 — Scouting Knowledge',id:'1a',badge:'g',
   title:'Scout Oath, Law, Motto & Slogan',
   quiz:'Recite the Scout Oath, Scout Law, Scout Motto, and Scout Slogan from memory. Explain what each means.',
   img:{src:'scout-assets/scout_oath_and_law_infographic_poster.png',lbl:'Scout Oath, Law, Motto & Slogan infographic',note:null},
   blocks:[
     {c:'g',lbl:'Scout Oath',tx:'On my honor I will do my best\nTo do my duty to God and my country\nAnd to obey the Scout Law;\nTo help other people at all times;\nTo keep myself physically strong,\nmentally awake, and morally straight.'},
     {c:'g',lbl:'Scout Law — 12 Points',tx:'A Scout is:\nTrustworthy · Loyal · Helpful · Friendly · Courteous · Kind\nObedient · Cheerful · Thrifty · Brave · Clean · Reverent'},
     {c:'g',lbl:'Scout Motto',tx:'Be Prepared.'},
     {c:'g',lbl:'Scout Slogan',tx:'Do a Good Turn Daily.'},

// ── INIT STATE ──────────────────────────────────────────────────────────────
rankReqs.forEach(r=>{LR[r.id]=false;QR[r.id]={shown:false,knew:null};});
totinReqs.forEach(r=>{LT[r.id]=false;QT[r.id]={shown:false,knew:null};});

// ── HELPERS ──────────────────────────────────────────────────────────────────
const AR=()=>sec==='rank'?rankReqs:totinReqs;
const AL=()=>sec==='rank'?LR:LT;
const AQ=()=>sec==='rank'?QR:QT;
const isTc=()=>sec==='totin';
const col=()=>isTc()?'t':'g';
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;');}
function nl(s){return esc(s).replace(/\n/g,'<br>');}
function tsFmt(ts){const d=new Date(ts);return d.toLocaleDateString()+'  '+d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});}
function openLB(src,alt){
  document.getElementById('lb-img').src=src;
  document.getElementById('lb-img').alt=alt||'';
  document.getElementById('lb').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeLB(){
  document.getElementById('lb').classList.remove('open');
  document.body.style.overflow='';
}

// ── SECTION/MODE ─────────────────────────────────────────────────────────────
function setSec(s){
  sec=s;
  ['rank','totin','results'].forEach(x=>document.getElementById('tab-'+x)?.classList.remove('active'));
  document.getElementById('tab-'+s)?.classList.add('active');
  const mb=document.getElementById('mbar');
  mb.style.display=s==='results'?'none':'flex';
  ['btn-study','btn-quiz'].forEach(id=>document.getElementById(id)?.classList.toggle('tb',isTc()));
  updateProgress();render();
}
function setMode(m){
  mode=m;
  document.getElementById('btn-study').classList.toggle('active',m==='study');
  document.getElementById('btn-quiz').classList.toggle('active',m==='quiz');
  if(m==='quiz') logActivity('quiz_start','Started quiz: '+sec);
  render();
}
function toggleCard(id){document.getElementById('card-'+id)?.classList.toggle('open');}

function markLearned(id){
  AL()[id]=!AL()[id];
  const status=AL()[id]?'learned':'incomplete';
  logActivity('study',id+' marked '+status);
  sheetLog('study', id+' — '+status);
  saveProgress();
  updateProgress();
  updateWelcome();
  render();
}
function revealAnswer(id){
  AQ()[id].shown=true;
  logActivity('quiz_reveal','Revealed: '+id);
  sheetLog('quiz_reveal', id);
  saveProgress();
  render();
}
function markKnew(id,val){
  AQ()[id].knew=val;AL()[id]=val;
  const result=val?'knew it':'needs practice';
  logActivity('quiz_answer',id+' — '+result);
  sheetLog('quiz_answer', id+' — '+result);
  saveProgress();
  updateProgress();
  updateWelcome();
  render();
}

function setNameAndRender(n){
  setName(n);
  sheetLog('identity','Name set: '+n);
  saveProgress();
  updateWelcome();
  // After name is set, try to load their Firebase progress
  loadProgress();
}

function updateProgress(){
  if(sec==='results') return;
  const L=AL(),R=AR();
  const n=Object.values(L).filter(Boolean).length,tot=R.length;
  const pct=tot?Math.round(n/tot*100):0;
  document.getElementById('pb').style.width=pct+'%';
  document.getElementById('pl').textContent=n+' / '+tot+' learned';
  document.getElementById('psl').textContent=sec==='rank'?'Scout Rank':'Totin\' Chip';
}

// ── VIDEO TABS ───────────────────────────────────────────────────────────────
const activeVid={};
function setVidTab(reqId,idx){
  activeVid[reqId]=idx;
  const wrap=document.getElementById('vid-wrap-'+reqId);
  if(!wrap) return;
  const tabs=wrap.querySelectorAll('.vtab');
  tabs.forEach((t,i)=>t.classList.toggle('active',i===idx));
  const vf=wrap.querySelector('.vf');
  const vids=wrap.dataset.vids?JSON.parse(wrap.dataset.vids):[];
  if(vids[idx]) vf.innerHTML='<iframe src="https://www.youtube.com/embed/'+vids[idx].id+'?rel=0" allowfullscreen loading="lazy"></iframe>';
}

// ── RENDER ───────────────────────────────────────────────────────────────────
function render(){
  const main=document.getElementById('main');
  const gate=document.getElementById('name-gate');

  // Show full-screen gate if no name selected — blocks everything
  if(!getName()){
    gate.style.display='flex';
    document.getElementById('mbar').style.display='none';
    return;
  } else {
    gate.style.display='none';
    document.getElementById('mbar').style.display=sec==='results'?'none':'flex';
  }

  if(sec==='results'){renderResults();return;}
  const reqs=AR(),L=AL(),Q=AQ(),tc=isTc(),c=col();
  const allDone=reqs.every(r=>L[r.id]);
  let html='';
  if(tc){
    html+='<div class="notice"><div class="nl">Hands-on requirement</div>TC2, TC3, and TC4 require a live DEMONSTRATION to a Scout leader. This guide prepares the knowledge — you must demonstrate in person.</div>';
  } else {
    html+='<div class="info"><div class="il">Full rank — all 7 requirements</div>Req 1–3 and 5–6 are knowledge-based. Req 4 (knots) requires hands-on practice and in-person sign-off. Req 7 coaching is in the last card.</div>';
  }
  if(allDone){
    const allKnew=mode==='quiz'?reqs.every(r=>Q[r.id].knew===true):true;
    html+='<div class="cb2 '+c+'"><div class="ic">&#9733;</div>';
    if(mode==='quiz'&&allKnew) html+='<p>Ready for sign-off!</p><span>'+(tc?'Know all rules — go demonstrate the tools.':'Know all requirements — schedule your Scoutmaster conference.')+'</span>';
    else if(mode==='quiz') html+='<p>Keep practicing!</p><span>Review the ones you missed and retry.</span>';
    else html+='<p>All studied!</p><span>Switch to Quiz mode to test yourself.</span>';
    html+='</div>';
  }
  let lastGrp=null;
  if(mode==='study'){
    reqs.forEach(r=>{
      if(r.grp&&r.grp!==lastGrp){html+='<div class="sdiv">'+esc(r.grp)+'</div>';lastGrp=r.grp;}
      const done=L[r.id];
      html+='<div class="rc'+(done?' dk':'')+(tc?' tc':'')+'" id="card-'+r.id+'">';
      html+='<div class="ch" onclick="toggleCard(\''+r.id+'\')">';
      html+='<span class="rb '+r.badge+'">'+r.id+'</span>';
      html+='<span class="ct">'+esc(r.title)+'</span>';
      if(done) html+='<span style="color:'+(tc?'var(--bm)':'var(--gm)')+';font-size:16px">&#10003;</span>';
      html+='<span class="cv">&#8964;</span></div>';
      html+='<div class="cb">';
      // image(s)
      if(r.img){
        html+='<div class="ig-wrap"><div class="ig-lbl'+(tc?' t':'')+'">&#128247; '+esc(r.img.lbl)+'</div>';
        html+='<img src="'+r.img.src+'" alt="'+esc(r.img.lbl)+'" loading="lazy" onclick="openLB(\''+r.img.src+'\',\''+r.img.lbl.replace(/'/g,'')+'\')">'; 
        if(r.img.note) html+='<div class="ig-note">'+esc(r.img.note)+'</div>';
        html+='<div class="ig-hint">&#128269; Tap image to expand</div>';
        html+='</div>';
      }
      if(r.img2){
        html+='<div class="ig-wrap"><div class="ig-lbl'+(tc?' t':'')+'">&#128247; '+esc(r.img2.lbl)+'</div>';
        html+='<img src="'+r.img2.src+'" alt="'+esc(r.img2.lbl)+'" loading="lazy" onclick="openLB(\''+r.img2.src+'\',\''+r.img2.lbl.replace(/'/g,'')+'\')">'; 
        html+='<div class="ig-hint">&#128269; Tap image to expand</div>';
        html+='</div>';
      }
      // video(s)
      if(r.videos&&r.videos.length){
        const vid0=r.videos[0];
        const vidsJson=JSON.stringify(r.videos).replace(/"/g,'&quot;');
        html+='<div class="vw"><div class="vl">&#9654; Tutorial video</div>';
        if(r.videos.length>1){
          html+='<div class="vtabs" id="vtabs-'+r.id+'">';
          r.videos.forEach((v,i)=>html+='<button class="vtab'+(i===0?' active':'')+'" onclick="setVidTab(\''+r.id+'\','+i+')">Option '+(i+1)+'</button>');
          html+='</div>';
        }
        html+='<div id="vid-wrap-'+r.id+'" data-vids="'+vidsJson+'">';
        html+='<div class="vf"><iframe src="https://www.youtube.com/embed/'+vid0.id+'?rel=0" allowfullscreen loading="lazy" title="'+esc(vid0.lbl)+'"></iframe></div>';
        html+='</div></div>';
        activeVid[r.id]=0;
      }
      r.blocks.forEach(b=>{
        html+='<div class="cblk"><div class="cl '+b.c+'">'+esc(b.lbl)+'</div><div class="cx '+b.c+'">'+nl(b.tx)+'</div></div>';
      });
      if(r.tip) html+='<div class="tip"><div class="tl">Tip</div>'+nl(r.tip)+'</div>';
      html+='<button class="mkb'+(done?' dk '+c:'')+'" onclick="markLearned(\''+r.id+'\')">';
      html+=done?'<span>&#10003;</span> Got it — mark incomplete':'Mark as learned';
      html+='</button></div></div>';
    });
  } else {
    reqs.forEach(r=>{
      const qs=Q[r.id];
      html+='<div class="qc"><div class="qbr"><span class="rb '+r.badge+'">'+r.id+'</span><span style="font-size:12px;color:'+(tc?'var(--bm)':'var(--tm)')+';font-weight:500">'+esc(r.title)+'</span></div>';
      html+='<div class="qq">'+esc(r.quiz)+'</div>';
      if(!qs.shown){
        html+='<button class="rvb '+c+'" onclick="revealAnswer(\''+r.id+'\')">Say it out loud, then show answer</button>';
      } else {
        html+='<div class="aa sh">';
        r.blocks.forEach(b=>{
          html+='<div class="cblk"><div class="cl '+b.c+'">'+esc(b.lbl)+'</div><div class="cx '+b.c+'">'+nl(b.tx)+'</div></div>';
        });
        html+='<div class="kr">';
        html+='<button class="kb ky'+(qs.knew===true?' sy':'')+'" onclick="markKnew(\''+r.id+'\',true)">&#10003; Knew it</button>';
        html+='<button class="kb kn'+(qs.knew===false?' sn':'')+'" onclick="markKnew(\''+r.id+'\',false)">&#8635; Need practice</button>';
        html+='</div></div>';
      }
      html+='</div>';
    });
  }
  main.innerHTML=html;
}

function setNameAndRender(n){setName(n);render();}

// ── RESULTS ──────────────────────────────────────────────────────────────────
function renderResults(){
  const main=document.getElementById('main');
  const name=getName()||'Unknown';
  const logs=getLogs();

  // Stats
  const rankTotal=rankReqs.length,tcTotal=totinReqs.length;
  const rankDone=Object.values(LR).filter(Boolean).length;
  const tcDone=Object.values(LT).filter(Boolean).length;
  const quizAttempts=logs.filter(l=>l.type==='quiz_answer').length;
  const quizPassed=logs.filter(l=>l.type==='quiz_answer'&&l.detail.includes('knew it')).length;

  let html='';
  html+='<div class="user-card">';
  html+='<div class="user-avatar">'+esc(name.charAt(0))+'</div>';
  html+='<div class="user-info"><div class="user-name">'+esc(name)+'</div>';
  html+='<div class="user-device">'+esc(DEVICE)+' · Session: '+SID+'</div></div>';
  html+='<button onclick="changeName()" style="font-size:11px;padding:4px 10px;border-radius:99px;border:1px solid var(--bo);background:transparent;color:var(--tm);cursor:pointer">Change</button>';
  html+='</div>';

  html+='<div class="stat-row">';
  html+='<div class="stat-box"><div class="stat-num">'+rankDone+'/'+rankTotal+'</div><div class="stat-lbl">Rank reqs learned</div></div>';
  html+='<div class="stat-box"><div class="stat-num">'+tcDone+'/'+tcTotal+'</div><div class="stat-lbl">Totin\' Chip learned</div></div>';
  html+='<div class="stat-box"><div class="stat-num">'+(quizAttempts?Math.round(quizPassed/quizAttempts*100):0)+'%</div><div class="stat-lbl">Quiz pass rate</div></div>';
  html+='</div>';

  // Rank breakdown
  html+='<div class="res-section">Scout Rank — Requirement detail</div>';
  rankReqs.forEach(r=>{
    const q=QR[r.id];
    let badge,label;
    if(LR[r.id]&&q.knew===true){badge='rb-pass';label='&#10003; Knew it';}
    else if(q.knew===false){badge='rb-miss';label='&#8635; Needs practice';}
    else if(LR[r.id]){badge='rb-pass';label='&#10003; Studied';}
    else{badge='rb-todo';label='Not started';}
    html+='<div class="res-row"><span class="res-req"><span style="font-size:11px;font-weight:500;color:var(--gm)">'+r.id+'</span> '+esc(r.title)+'</span>';
    html+='<span class="res-badge '+badge+'">'+label+'</span></div>';
  });

  // Totin' Chip breakdown
  html+='<div class="res-section">Totin\' Chip — Requirement detail</div>';
  totinReqs.forEach(r=>{
    const q=QT[r.id];
    let badge,label;
    if(LT[r.id]&&q.knew===true){badge='rb-pass';label='&#10003; Knew it';}
    else if(q.knew===false){badge='rb-miss';label='&#8635; Needs practice';}
    else if(LT[r.id]){badge='rb-pass';label='&#10003; Studied';}
    else{badge='rb-todo';label='Not started';}
    html+='<div class="res-row"><span class="res-req"><span style="font-size:11px;font-weight:500;color:var(--bm)">'+r.id+'</span> '+esc(r.title)+'</span>';
    html+='<span class="res-badge '+badge+'">'+label+'</span></div>';
  });

  // Activity log
  html+='<div class="res-section">Recent activity</div>';
  if(logs.length===0){
    html+='<div class="no-data">No activity logged yet. Start studying!</div>';
  } else {
    const recent=logs.slice(0,25);
    recent.forEach(l=>{
      const detail=l.detail||'';
      html+='<div class="activity-item"><span>'+esc(detail)+'</span><span class="activity-time">'+tsFmt(l.ts)+'</span></div>';
    });
  }

  html+='<button class="clear-btn" onclick="clearData()">Clear all progress & logs</button>';
  main.innerHTML=html;
}

function changeName(){
  localStorage.removeItem('scout_name');
  render();
}
function clearData(){
  if(confirm('Clear all progress and activity logs? This cannot be undone.')){
    ['scout_log','scout_name','scout_sid'].forEach(k=>localStorage.removeItem(k));
    rankReqs.forEach(r=>{LR[r.id]=false;QR[r.id]={shown:false,knew:null};});
    totinReqs.forEach(r=>{LT[r.id]=false;QT[r.id]={shown:false,knew:null};});
    setSec('rank');
  }
}

// ── WELCOME & ENCOURAGEMENT ──────────────────────────────────────────────────
function getFirstName(n){ return n==='DJ3'?'DJ3':n==='DJ'?'DJ':n; }

function isFirstVisit(){
  const visits=parseInt(localStorage.getItem('scout_visits')||'0');
  if(visits===0){ localStorage.setItem('scout_visits','1'); return true; }
  localStorage.setItem('scout_visits',String(visits+1));
  return false;
}

function getEncouragement(pctRank, pctTotin){
  const overall=Math.round((pctRank+pctTotin)/2);
  if(overall===0)   return 'Let\'s get started — tap a requirement to begin.';
  if(overall<15)    return 'Good start! Keep working through the requirements.';
  if(overall<30)    return 'You\'re building momentum — keep it up!';
  if(overall<50)    return 'Almost halfway there. You\'ve got this!';
  if(overall<70)    return 'More than halfway done — excellent progress!';
  if(overall<85)    return 'Nearly there. The Scoutmaster conference is in sight!';
  if(overall<100)   return 'Almost ready for sign-off — finish strong!';
  return            'Everything studied! Time to schedule your sign-off. Be Prepared! ⚜️';
}

function updateWelcome(){
  const name=getName();
  if(!name) return;
  const fn=getFirstName(name);
  const rankDone=Object.values(LR).filter(Boolean).length;
  const totinDone=Object.values(LT).filter(Boolean).length;
  const pctRank=Math.round(rankDone/rankReqs.length*100);
  const pctTotin=Math.round(totinDone/totinReqs.length*100);
  const el=document.getElementById('welcome-msg');
  if(!el) return;
  const first=isFirstVisit();
  const greeting=first
    ? 'Welcome, '+fn+'! Ready to get started?'
    : 'Welcome back, '+fn+'! '+getEncouragement(pctRank,pctTotin);
  el.textContent=greeting;
}


if('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/scout-study-guide/sw.js', {
      scope: '/scout-study-guide/'
    }).then(reg => {
      console.log('SW registered:', reg.scope);

      // Check for updates every time the app opens
      reg.update();

      // When a new SW is found, activate it immediately
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            newWorker.postMessage({ type: 'SKIP_WAITING' });
          }
        });
      });
    }).catch(e => console.log('SW failed:', e));

    // When new SW takes control, reload to get fresh version
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!refreshing) {
        refreshing = true;
        window.location.reload();
      }
    });
  });
}

  try {

    body.append(GFORM_FIELDS.name,       getName() || 'Unknown');

// ── FIREBASE BRIDGE ───────────────────────────────────────────────────────────
// Firebase is loaded in a separate module script above and exposed via window._fb*
// This keeps the main script as a regular script (required for inline onclick handlers)

function getUserKey(name){ return name.replace(/[^a-zA-Z0-9]/g,'_').toLowerCase(); }

// Save full progress to Firebase + localStorage backup
async function saveProgress() {
  const name = getName();
  if (!name) return;
  const data = {
    learnedR: LR, learnedT: LT,
    quizR: QR, quizT: QT,
    name: name, version: APP_VERSION,
    saved: Date.now()
  };
  // Always save locally first (instant, works offline)
  try {
    localStorage.setItem('scout_progress_v1', JSON.stringify(data));
    sessionStorage.setItem('scout_progress_v1', JSON.stringify(data));
  } catch(e) {}
  // Then sync to Firebase
  if (window._fbReady && window._fbSave) {
    try {
      await window._fbSave(name, data);
      console.log('Synced to Firebase');
    } catch(e) {
      console.log('Firebase save failed (offline?):', e.message);
    }
  }
}

// Load progress — local first for speed, then Firebase for cross-device
async function loadProgress() {
  const name = getName();
  // Apply local immediately so app feels instant
  try {
    const local = localStorage.getItem('scout_progress_v1') || sessionStorage.getItem('scout_progress_v1');
    if (local) applyProgress(JSON.parse(local));
  } catch(e) {}

  // Then check Firebase for newer cross-device state
  if (name && window._fbReady && window._fbLoad) {
    try {
      const fbData = await window._fbLoad(name);
      if (fbData) {
        const localData = JSON.parse(localStorage.getItem('scout_progress_v1') || '{}');
        if (!localData.saved || fbData.saved > localData.saved) {
          applyProgress(fbData);
          localStorage.setItem('scout_progress_v1', JSON.stringify(fbData));
          console.log('Progress restored from Firebase:', new Date(fbData.saved).toLocaleString());
        }
      }
    } catch(e) {
      console.log('Firebase load failed (offline?) — using local:', e.message);
    }
  }
  updateProgress();
  updateWelcome();
  render();
}

function applyProgress(data) {
  if (!data) return;
  if (data.learnedR) Object.keys(data.learnedR).forEach(k => { if(k in LR) LR[k] = data.learnedR[k]; });
  if (data.learnedT) Object.keys(data.learnedT).forEach(k => { if(k in LT) LT[k] = data.learnedT[k]; });
  if (data.quizR)    Object.keys(data.quizR).forEach(k =>    { if(k in QR) QR[k] = data.quizR[k]; });
  if (data.quizT)    Object.keys(data.quizT).forEach(k =>    { if(k in QT) QT[k] = data.quizT[k]; });
}
